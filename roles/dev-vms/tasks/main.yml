---
- name: Install virtualization packages
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - virtinst
      - cloud-image-utils
      # trixie amd64 cloud images are UEFI-only; vm-new boots with --boot uefi
      - ovmf
    state: present
  become: true
  tags: system

- name: Add user to virtualization groups
  ansible.builtin.user:
    name: "{{ dev_vms_user }}"
    groups:
      - kvm
      - libvirt
    append: true
  become: true
  tags: system

- name: Enable and start libvirtd
  ansible.builtin.systemd_service:
    name: libvirtd
    state: started
    enabled: true
  become: true
  tags: system

- name: Read default libvirt network state
  ansible.builtin.command: virsh net-info default
  register: dev_vms_net_info
  changed_when: false
  become: true
  tags: system

- name: Autostart the default libvirt network
  ansible.builtin.command: virsh net-autostart default
  when: dev_vms_net_info.stdout is not search('Autostart:\s+yes')
  become: true
  tags: system

- name: Start the default libvirt network
  ansible.builtin.command: virsh net-start default
  when: dev_vms_net_info.stdout is not search('Active:\s+yes')
  become: true
  tags: system

- name: Create template image directory
  ansible.builtin.file:
    path: "{{ dev_vms_template_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: system

# setgid + group-writable so vm-new/vm-dispose can manage overlays without sudo
- name: Create VM pool directory
  ansible.builtin.file:
    path: "{{ dev_vms_pool_dir }}"
    state: directory
    owner: root
    group: libvirt
    mode: "2775"
  become: true
  tags: system

# get_url's own "checksum: sha512:URL" remote-fetch doesn't route that secondary request
# through the environment below (verified: it 403s via a proxy even though the main download
# right after it, given the same environment, succeeds) -- so the checksum file is fetched
# and grepped explicitly instead, and only the resulting hash is passed to get_url.
- name: Fetch Debian cloud image checksums
  ansible.builtin.get_url:
    url: "{{ dev_vms_checksum_url }}"
    dest: /tmp/dev-vms-checksums.txt
    mode: "0644"
  become: true
  # become drops the invoking user's http_proxy/https_proxy (e.g. set in /etc/environment
  # by a dev VM's own cloud-init, when this role runs nested inside one) — re-supply them
  # explicitly so the fetch isn't attempted direct, which the egress nwfilter blocks.
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') | default(omit, true) }}"
    https_proxy: "{{ lookup('env', 'https_proxy') | default(omit, true) }}"
  tags: system

- name: Read the checksum for our image out of it
  ansible.builtin.shell: "grep {{ dev_vms_image_name }} /tmp/dev-vms-checksums.txt | awk '{print $1}'"
  register: dev_vms_image_checksum
  changed_when: false
  tags: system

- name: Download Debian cloud template image
  ansible.builtin.get_url:
    url: "{{ dev_vms_image_url }}"
    dest: "{{ dev_vms_template_dir }}/{{ dev_vms_image_name }}"
    checksum: "sha512:{{ dev_vms_image_checksum.stdout }}"
    mode: "0644"
  become: true
  environment:
    http_proxy: "{{ lookup('env', 'http_proxy') | default(omit, true) }}"
    https_proxy: "{{ lookup('env', 'https_proxy') | default(omit, true) }}"
  tags: system

- name: Generate SSH key for dev VMs
  ansible.builtin.command: ssh-keygen -t ed25519 -N "" -C dev-vms -f {{ dev_vms_ssh_key }}
  args:
    creates: "{{ dev_vms_ssh_key }}"
  tags: user

- name: Create user bin directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"
  tags: user

- name: Install VM management scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - vm-new
    - vm-dispose
    - vm-ip
    - vm-list
  tags: user

- name: Create SSH config fragment directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh/dev-vms.d"
    state: directory
    mode: "0700"
  tags: user

- name: Include dev VM entries in SSH config
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.ssh/config"
    line: Include dev-vms.d/*.conf
    insertbefore: BOF
    create: true
    mode: "0600"
  tags: user

- name: Host-enforced network containment for dev VMs
  ansible.builtin.import_tasks: network-lockdown.yml
